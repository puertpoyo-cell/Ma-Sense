name: Screenshots

# 시뮬레이터에서 앱을 예시 데이터로 띄워 화면별 스크린샷을 찍는다 (육안 확인·스토어 스크린샷 초안).
# 커밋 메시지에 [shots]가 있거나 수동 실행(workflow_dispatch)일 때만 돈다. 화면은 DEBUG 실행 인자 -route (ScreenshotRoute)
on:
  workflow_dispatch:
    inputs:
      xcode:
        description: "Xcode 버전 앞자리 (예: 26). 비우면 러너 기본 Xcode"
        required: false
        default: ""
  push:

jobs:
  shots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[shots]')
    # 동시성 그룹을 두지 않는다. 같은 그룹이면 [shots] 없는 푸시(job은 건너뜀)도 진행 중인 촬영을 취소한다
    name: 시뮬레이터 스크린샷
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # 실기기와 같은 SDK로 확인할 때 (예: iOS 26 기기에서만 보이는 문제)
      - name: Select Xcode
        if: github.event_name == 'workflow_dispatch' && inputs.xcode != ''
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode_* || true
          APP=$(ls -d /Applications/Xcode_${{ inputs.xcode }}*.app | sort -V | tail -1)
          sudo xcode-select -s "$APP"
          xcodebuild -version

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          # 가장 새 iOS 런타임의 iPhone
          DEVICE=$(xcrun simctl list devices available -j \
            | jq -c '[.devices | to_entries | map(select(.key | contains("iOS"))) | sort_by(.key) | last | .value[] | select(.name | startswith("iPhone"))] | first')
          echo "Using simulator: $DEVICE"
          echo "udid=$(echo "$DEVICE" | jq -r .udid)" >> "$GITHUB_OUTPUT"

      - name: Build app (Debug, simulator)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Masense.xcodeproj \
            -scheme Masense \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot simulator and install
        run: |
          set -euo pipefail
          UDID=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Masense.app

      - name: Capture screens
        run: |
          set -euo pipefail
          UDID=${{ steps.sim.outputs.udid }}
          BUNDLE=com.masense.app
          mkdir -p shots
          shoot() {
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE" -seedSampleData -route "$2" -AppleLanguages "(ko)" -AppleLocale ko_KR > /dev/null
            sleep 6
            xcrun simctl io "$UDID" screenshot "shots/$1.png" > /dev/null
            echo "captured $1"
          }
          for route in splash today settings history.dose history.condition history.weight history.habits report \
                       sheet.dose sheet.condition sheet.protein sheet.strength sheet.backfill sheet.questions sheet.weightTrend sheet.import sheet.import.result; do
            shoot "$route" "$route"
          done
          # 접근성 최대 글자 크기
          if xcrun simctl ui "$UDID" content_size accessibility-extra-extra-extra-large; then
            for route in today history.habits; do
              shoot "ax-$route" "$route"
            done
            xcrun simctl ui "$UDID" content_size large || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png

      # 아티팩트를 받을 수 없는 환경에서도 볼 수 있게, 줄인 JPEG을 로그에 base64로 남긴다
      - name: Print compressed screenshots
        run: |
          for f in shots/*.png; do
            name=$(basename "$f" .png)
            sips -s format jpeg -s formatOptions 50 -Z 1400 "$f" --out "shots/$name.jpg" > /dev/null
            echo "=====SHOT $name"
            # 한 줄을 길게 해 로그 끝 몇천 줄 안에 모든 장이 들어가게 한다
            base64 -b 3000 -i "shots/$name.jpg"
            echo "=====END $name"
          done

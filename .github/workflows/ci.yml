name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compliance:
    name: 금지선 점검 (COMPLIANCE.md)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/compliance_check.py

  test:
    name: xcodebuild test (iOS Simulator)
    # D23 (2026-10-30): iPhone Duo 펼친 화면을 다 쓰려면 iOS 27.1 SDK(Xcode 27.1)로 빌드해야 한다.
    # GitHub 호스팅 러너는 `xcode-27` 이미지(공개 미리보기, 기본 Xcode 27.1)에만 Xcode 27이 있다
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          # 러너 이미지마다 시뮬레이터 이름이 달라서(iPhone 16, 17 ...) 사용 가능한 첫 iPhone을 고른다.
          NAME=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone")) | .name] | first')
          if [ -z "$NAME" ] || [ "$NAME" = "null" ]; then
            echo "No iPhone simulator available" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild \
            -project Masense.xcodeproj \
            -scheme Masense \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult \
            test

      - name: Show test failures
        if: failure()
        run: |
          # 크래시·실패 원인은 xcodebuild 로그에 안 나오고 결과 번들에만 남는다
          xcrun xcresulttool get test-results summary --path TestResults.xcresult --format json \
            | jq '{result, failedTests, testFailures}' || true
          # "Test crashed with signal trap"의 원인 줄(Fatal error 등)은 시뮬레이터 크래시 보고서에 있다
          for report in $(ls -t ~/Library/Logs/DiagnosticReports/Masense*.ips 2>/dev/null | head -2); do
            echo "== $report"
            grep -E '"asi"|Fatal error|fatalError|Precondition|Index out of range|Unexpectedly found nil' "$report" | head -20 || true
            python3 -c "import json,sys; t=open(sys.argv[1]).read().split('\n',1)[1]; d=json.loads(t); print('asi', d.get('asi')); print('exception', d.get('exception')); th=[x for x in d.get('threads',[]) if x.get('triggered')]; fr=th[0]['frames'][:25] if th else []; imgs=d.get('usedImages',[]); [print(i, imgs[f['imageIndex']].get('name','?') if f.get('imageIndex') is not None and f['imageIndex']<len(imgs) else '?', f.get('symbol','?'), f.get('sourceFile',''), f.get('sourceLine','')) for i,f in enumerate(fr)]" "$report" || true
          done

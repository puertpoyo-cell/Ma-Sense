name: TestFlight

# N-A (2026-10-29 사람 승인): main에 앱 코드가 바뀌어 올라가면 Archive → App Store Connect 업로드 → TestFlight.
# 서명은 Xcode 클라우드 관리 서명(App Store Connect API 키만으로 인증서·프로파일을 만들어 씀)이라 .p12·프로파일 Secrets가 필요 없다.
# 필요한 Secrets 3개 (docs/TESTFLIGHT.md 6): ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY(.p8 내용 그대로)
# Secrets가 없으면 아무것도 하지 않고 끝난다 (CI와 별개, 실패로 보지 않음)

on:
  push:
    branches: [main]
    paths:
      - "Masense/**"
      - "Shared/**"
      - "MasenseWidgets/**"
      - "Config/**"
      - "Masense.xcodeproj/project.pbxproj"
      - ".github/workflows/testflight.yml"
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  gate:
    name: Secrets 확인
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "App Store Connect API Secrets가 없어 업로드를 건너뜁니다 (docs/TESTFLIGHT.md 6)."
          fi

  upload:
    name: Archive → TestFlight
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    # D23 (2026-10-30): iPhone Duo 펼친 화면을 다 쓰려면 iOS 27.1 SDK(Xcode 27.1)로 빌드해야 한다.
    # GitHub 호스팅 러너는 `xcode-27` 이미지(공개 미리보기)에만 Xcode 27이 있다. App Store Connect는 iOS 26 SDK 이상만 받는다
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      # 러너의 정식 Xcode 27.1 (RC·beta는 뺌). 없으면 이미지 기본 Xcode
      - name: Select Xcode 27.1
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode_* || true
          APP=$(ls -d /Applications/Xcode_27.1.app 2>/dev/null || true)
          if [ -n "$APP" ]; then sudo xcode-select -s "$APP"; fi
          xcodebuild -version

      - name: Write API key
        env:
          PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        # Secret에 줄바꿈 없이 한 줄로 붙여 넣었거나(2026-10-30 invalidPEMDocument) 앞뒤 공백이 섞여도 PEM을 다시 만든다:
        # BEGIN/END 머리글·공백을 걷어 내고 base64 본문만 64자씩 다시 줄 바꿈
        run: |
          mkdir -p ~/private_keys
          python3 - <<'PY'
          import os, re, pathlib
          raw = os.environ["PRIVATE_KEY"]
          body = re.sub(r"-----(BEGIN|END)[^-]*-----", "", raw)
          body = re.sub(r"\s+", "", body)
          if not body:
              raise SystemExit("ASC_PRIVATE_KEY가 비어 있습니다")
          lines = [body[i:i + 64] for i in range(0, len(body), 64)]
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END PRIVATE KEY-----\n"
          path = pathlib.Path.home() / "private_keys" / f"AuthKey_{os.environ['KEY_ID']}.p8"
          path.write_text(pem)
          print(f"키 길이 {len(body)}자, {len(lines)}줄로 썼습니다")
          PY
          chmod 600 ~/private_keys/AuthKey_$KEY_ID.p8

      # 2026-11-01: Archive가 "Authentication failed"로 멈출 때 원인을 바로 보이게. API 키로 App Store Connect에 직접 물어
      # 상태 코드와 오류 코드만 찍는다 (키·토큰은 찍지 않음). 예: 403 FORBIDDEN.REQUIRED_AGREEMENTS_MISSING_OR_EXPIRED = 새 계약 동의 필요
      - name: Check App Store Connect API key
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --disable-pip-version-check --break-system-packages pyjwt cryptography 2>/dev/null \
            || python3 -m pip install --quiet --disable-pip-version-check pyjwt cryptography
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error, pathlib
          import jwt
          key = (pathlib.Path.home() / "private_keys" / f"AuthKey_{os.environ['KEY_ID']}.p8").read_text()
          now = int(time.time())
          token = jwt.encode({"iss": os.environ["ISSUER_ID"], "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
                             key, algorithm="ES256", headers={"kid": os.environ["KEY_ID"], "typ": "JWT"})
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?limit=1", headers={"Authorization": f"Bearer {token}"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print(f"API 키 확인: {r.status} 정상")
          except urllib.error.HTTPError as e:
              body = e.read().decode(errors="replace")
              try:
                  errors = json.loads(body).get("errors", [])
                  for err in errors:
                      print(f"API 키 확인 실패: {e.code} {err.get('code')} | {err.get('title')} | {err.get('detail')}")
              except Exception:
                  print(f"API 키 확인 실패: {e.code} {body[:300]}")
          PY

      # 2026-11-01: 러너는 매번 빈 키체인이라 클라우드 서명이 실행마다 Apple Development 인증서를 새로 만들어
      # 계정 한도("reached the maximum number of certificates")에 걸렸다. Secrets에 인증서(.p12)가 있으면 그것을 넣어 새로 만들지 않게 한다.
      # 없으면 이전처럼 새로 만든다 (한도에 걸리면 developer.apple.com에서 "Created via API" 개발 인증서를 지운다, TESTFLIGHT.md 2-2)
      - name: Import signing certificate (optional)
        env:
          P12_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "BUILD_CERTIFICATE_BASE64가 없어 클라우드 서명이 개발 인증서를 새로 만듭니다."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | sed 's/"[^"]*"/"(이름 생략)"/'

      - name: Build number and version
        id: ver
        run: |
          BUILD=$(grep -m1 'CURRENT_PROJECT_VERSION = ' Masense.xcodeproj/project.pbxproj | sed 's/[^0-9]//g')
          VERSION=$(grep -m1 'MARKETING_VERSION = ' Masense.xcodeproj/project.pbxproj | sed 's/.*= //; s/;//')
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "버전 $VERSION 빌드 $BUILD"

      - name: Archive (cloud-managed signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project Masense.xcodeproj \
            -scheme Masense \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Masense.xcarchive \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -skipPackagePluginValidation \
            archive

      - name: Export options
        run: |
          cat > build/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>24F957FFAD</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF

      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          xcodebuild \
            -exportArchive \
            -archivePath build/Masense.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "업로드 완료: 버전 ${{ steps.ver.outputs.version }} 빌드 ${{ steps.ver.outputs.build }}. 처리 뒤 TestFlight에 나타납니다 (보통 5~15분)."

      - name: Clean up key
        if: always()
        run: |
          rm -f ~/private_keys/AuthKey_$KEY_ID.p8
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
